<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription à l'évènement</title>
  <!-- Chargement de Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <!-- Carte principale -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 border border-slate-200">

    <h2 class="text-2xl font-bold text-slate-800 text-center mb-2">
      Inscription à l'évènement 
    </h2>
    <p class="text-sm text-slate-500 text-center mb-6">
      Remplissez ce formulaire pour réserver votre place
    </p>

    <form class="space-y-4" action="http://localhost:5678/webhook-test/ef10708d-6b16-448b-a78a-d755702b8116" method="post">

      <!-- Nom -->
      <div>
        <label for="lastname" class="block text-sm font-semibold text-slate-700 mb-1">
          Nom
        </label>
        <input
          type="text"
          id="lastname"
          name="lastname"
          placeholder="Dupont"
          required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
        >
      </div>

      <!-- Prenom-->
      <div>
        <label for="firstname" class="block text-sm font-semibold text-slate-700 mb-1">
          Prénom
        </label>
        <input
          type="text"
          id="firstname"
          name="firstname"
          placeholder="Jean"
          required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
        >
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">
          Adresse email
        </label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="jean.dupont@email.com"
          required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
        >
      </div>

      <!-- Téléphone et nombre de places côte à côte -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="phone" class="block text-sm font-semibold text-slate-700 mb-1">
            Téléphone
          </label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="06 12 34 56 78"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
          >
        </div>

        <div>
          <label for="seats" class="block text-sm font-semibold text-slate-700 mb-1">
            Nombre de places
          </label>
          <input
            type="number"
            id="seats"
            name="seats"
            placeholder="1"
            min="1"
            value="1"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
          >
        </div>
      </div>

      <!-- Message / commentaire -->
      <div>
        <label for="message" class="block text-sm font-semibold text-slate-700 mb-1">
          Message (optionnel)
        </label>
        <textarea
          id="message"
          name="message"
          rows="3"
          placeholder="Une question, une remarque, un besoin particulier..."
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800 resize-none"
        ></textarea>
      </div>

      <!-- Bouton de validation -->
      <button
        type="submit"
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-150 ease-in-out"
      >
        S'inscrire à l'évènement
      </button>

    </form>
  </div>

</body>
</html>
