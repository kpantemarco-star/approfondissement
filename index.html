<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interface de Paiement - Tailwind CSS</title>
  <!-- Chargement de Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4 font-sans antialiased">

  <!-- Carte principale -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
    
    <h2 class="text-2xl font-bold text-slate-800 text-center mb-6">
      Informations de paiement
    </h2>

   <form class="space-y-4" action="http://localhost:5678/webhook-test/ef10708d-6b16-448b-a78a-d755702b8116" method="post">
      
      <!-- Nom du titulaire -->
      <div>
        <label for="cardholder" class="block text-sm font-semibold text-slate-700 mb-1">
          Nom sur la carte
        </label>
        <input 
          type="text" 
          id="cardholder"
          name="cardholder"
          placeholder="Jean Dupont" 
          required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
        >
      </div>

      <!-- Numéro de carte -->
      <div>
        <label for="cardnumber" class="block text-sm font-semibold text-slate-700 mb-1">
          Numéro de carte
        </label>
        <input 
          type="text" 
          id="cardnumber" 
          name="cardnumber"
          placeholder="0000 0000 0000 0000" 
          maxlength="19" 
          required
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
        >
      </div>

      <!-- Expiration et CVV côte à côte -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="expiry" class="block text-sm font-semibold text-slate-700 mb-1">
            Date d'expiration
          </label>
          <input 
            type="text" 
            id="expiry"
            name="expiry"
            placeholder="MM/AA" 
            maxlength="5" 
            required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
          >
        </div>

        <div>
          <label for="cvv" class="block text-sm font-semibold text-slate-700 mb-1">
            Cryptogramme (CVV)
          </label>
          <input 
            type="password" 
            id="cvv" 
            name="cvv"
            placeholder="123" 
            maxlength="3" 
            required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition placeholder-slate-400 text-slate-800"
          >
        </div>
      </div>

      <!-- Bouton de validation -->
      <button 
        type="submit" 
        class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-150 ease-in-out"
      >
        Payer maintenant
      </button>

    </form>
  </div>

</body>
</html>
